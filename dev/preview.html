<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面板预览</title>
<style>
  :root { --bg: #1b1b1d; --card: #252528; --text: #e8e8ea; --muted: #9a9aa0; --line: #38383d; --accent: #3d8ff2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", "Microsoft YaHei UI", -apple-system, sans-serif; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 24px 16px; }
  .stage { margin: 0 20px 20px 0; }
  .stage p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  .frame { display: block; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,.45); background: #323232; max-width: 100%; }
  aside { width: 260px; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; letter-spacing: .03em; }
  .row { display: flex; flex-wrap: wrap; margin: -3px; }
  button { margin: 3px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: #2f2f33; color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: #55555c; }
  button.on { border-color: var(--accent); background: rgba(61,143,242,.18); }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
  <div class="stage">
    <p id="sizeLabel">面板尺寸 760 × 620（Photoshop 中的默认大小）</p>
    <iframe id="panel" class="frame" src="panel-frame.html" width="760" height="620" title="插件面板"></iframe>
  </div>
  <aside>
    <h1>模拟 Photoshop</h1>
    <p class="sub">这里的按钮代替你在 Photoshop 里的操作。面板是真实代码，只有 Photoshop、Generator 和文件读写是模拟的。</p>

    <h2>在 Photoshop 中选中</h2>
    <div class="row" id="layers"></div>
    <div class="row"><button data-act="edit">编辑一下内容</button><button data-act="close">关闭文档</button></div>

    <h2>导出时 Generator 的表现</h2>
    <div class="row" id="scenarios">
      <button data-scenario="normal" class="on">正常（约 1 秒）</button>
      <button data-scenario="dropped">请求被丢 → 10 秒后自动重发</button>
      <button data-scenario="fail">一直没有响应</button>
    </div>

    <h2>Photoshop 界面颜色</h2>
    <div class="row" id="themes"><button data-theme="dark" class="on">深色</button><button data-theme="light">浅色</button></div>

    <h2>面板尺寸</h2>
    <div class="row" id="sizes"><button data-size="760x620" class="on">默认 760×620</button><button data-size="560x620">窄 560×620</button><button data-size="420x560">最小 420×560</button></div>

    <h2>其他</h2>
    <div class="row"><button data-act="reset">恢复示例数据</button></div>
    <p class="note">点右侧目录的“导出”试试，也可以在名称框里按 Enter。整图在右下角单独导出。输出尺寸填好后点“固定”，切换图层也会保持。顶部“日志”可以看到每一步的记录。</p>
  </aside>
<script>
(function () {
  var frame = document.getElementById('panel');
  function ps() { return frame.contentWindow.mockPS; }
  function mark(group, btn) { Array.prototype.forEach.call(group.children, function (b) { b.classList.toggle('on', b === btn); }); }
  frame.addEventListener('load', function () {
    var layers = document.getElementById('layers'); layers.innerHTML = '';
    ps().state.layers.forEach(function (l, i) {
      var b = document.createElement('button'); b.textContent = l.name; b.title = l.kind + ' ' + l.w + '×' + l.h;
      if (i === ps().state.selected) { b.className = 'on'; }
      b.onclick = function () { ps().select(i); mark(layers, b); }; layers.appendChild(b);
    });
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !ps()) { return; }
    if (b.dataset.act === 'edit') { ps().edit(); }
    if (b.dataset.act === 'close') { ps().closeDoc(); mark(document.getElementById('layers'), null); }
    if (b.dataset.act === 'reset') { ps().reset(); }
    if (b.dataset.scenario) { ps().scenario(b.dataset.scenario); mark(b.parentNode, b); }
    if (b.dataset.theme) { ps().theme(b.dataset.theme); mark(b.parentNode, b); }
    if (b.dataset.size) {
      var wh = b.dataset.size.split('x'); frame.width = wh[0]; frame.height = wh[1];
      document.getElementById('sizeLabel').textContent = '面板尺寸 ' + wh[0] + ' × ' + wh[1]; mark(b.parentNode, b);
    }
  });
}());
</script>
</body>
</html>
