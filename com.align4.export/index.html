<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:">
<title>4 倍数导出</title><link rel="stylesheet" href="css/panel.css"></head>
<body>
<div class="app" id="app">
 <header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>4 倍数导出</span></div>
  <button id="openLog" class="ghost-button" title="运行日志与诊断信息">日志</button>
 </header>

 <div class="body">
  <div class="object-area">
   <section class="object" aria-live="polite">
    <div class="object-head"><span id="objectKind" class="badge">图层</span><button id="refresh" class="icon-button" title="重新读取当前选择" aria-label="重新读取当前选择">↻</button></div>
    <h1 id="objectName">选择一个图层</h1>
    <div class="size-flow">
     <div class="size-cell"><span class="size-label">原始</span><span id="sizeSource" class="size-value">— × —</span></div>
     <span class="size-arrow" aria-hidden="true">→</span>
     <div class="size-cell"><span class="size-label">输出</span><strong id="sizeTarget" class="size-value">— × —</strong></div>
    </div>
    <p id="objectHint" class="hint"></p>
   </section>

  </div>
  <main class="settings">
   <!-- One form: a short label on the left of every row, controls on the right. -->
   <div class="form">
    <div class="form-row">
     <label class="form-label" for="exportName">名称</label>
     <div class="form-control name-row">
      <div class="field prefix-field"><input id="prefix" type="text" maxlength="32" placeholder="前缀" autocomplete="off" spellcheck="false" aria-label="文件名前缀"><button id="clearPrefix" class="field-clear" title="清空前缀" aria-label="清空前缀">×</button></div>
      <div class="field name-field"><input id="exportName" type="text" maxlength="120" placeholder="导出名称" autocomplete="off" spellcheck="false" aria-label="导出名称" title="按 Enter 导出到最近使用的目录"><button id="resetName" class="field-action" title="恢复为当前图层名" hidden>用图层名</button></div>
     </div>
    </div>

    <div class="form-row">
     <span class="form-label">文件</span>
     <div class="form-control">
      <div id="englishRow" class="file-field readonly">
       <span id="filePrefix" class="file-fix" hidden></span>
       <input id="englishName" class="file-input" type="text" maxlength="120" autocomplete="off" spellcheck="false" readonly aria-label="导出文件名" title="按 Enter 导出到最近使用的目录；Esc 恢复自动翻译">
       <span class="file-fix">.png</span>
       <button id="englishReset" class="field-action" hidden title="放弃修改，恢复自动翻译">恢复</button>
       <span id="fileName" class="sr-only"></span>
       <span id="fileMeasure" class="file-measure" aria-hidden="true"></span>
      </div>
      <p id="translateNote" class="translate-note" hidden></p>
     </div>
    </div>

    <div class="form-row" id="sizeGroup">
     <span class="form-label">尺寸</span>
     <div class="form-control size-row">
      <label class="field size-field"><span>宽</span><input id="minWidth" type="number" min="1" max="30000" step="1" placeholder="自动" aria-label="最小输出宽度" title="留空：按实际尺寸自动补齐到 4 的倍数"></label>
      <span class="times">×</span>
      <label class="field size-field"><span>高</span><input id="minHeight" type="number" min="1" max="30000" step="1" placeholder="自动" aria-label="最小输出高度" title="留空：按实际尺寸自动补齐到 4 的倍数"></label>
      <button id="lockSize" class="lock-button" aria-pressed="false" title="固定后，之后的每张切图都按这个尺寸输出"><svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.3"/><path class="shackle" d="M4.5 6V4.3a2.5 2.5 0 0 1 5 0V6"/></svg><span>固定</span></button>
     </div>
    </div>

    <div class="form-row">
     <span class="form-label">选项</span>
     <div class="form-control options">
      <div class="option-line">
       <label class="toggle-row" title="把名称里的中文离线翻译成英文：我的术语表 → 内置术语表 → 离线词典；查不到的保留中文"><input id="translate" type="checkbox"><span class="toggle" aria-hidden="true"></span><span>翻译成英文</span></label>
       <button id="openGlossary" class="link-button" title="打开“我的术语表”，可以自己添加或修改译法">术语表</button>
      </div>
      <div class="option-line">
       <label class="toggle-row" title="补边后调用已安装的 SuperPNG 重新编码；失败时不会改存普通 PNG"><input id="superPNG" type="checkbox"><span class="toggle" aria-hidden="true"></span><span>SuperPNG 编码</span></label>
       <span class="inline-hint">需先安装 SuperPNG</span>
      </div>
     </div>
    </div>
   </div>
  </main>

  <aside class="destinations" aria-label="导出目录">
   <div class="dest-head"><h2>导出到</h2><span id="directoryCount" class="count">0</span><button id="addDirectory" class="link-button">＋ 添加目录</button></div>
   <div id="directoryList" class="dest-list"></div>
   <section class="canvas-card" aria-label="整图导出">
    <div class="canvas-head"><h2>整图导出</h2><span class="muted">整张画布，不受选中图层影响</span></div>
    <div class="canvas-dir">
     <span class="dest-icon" id="canvasIcon" aria-hidden="true"></span>
     <div class="dest-main">
      <strong id="canvasDirName" class="canvas-dir-name">未选择目录</strong>
      <p id="canvasDirPath" class="dest-path">整图使用单独的目录</p>
      <p id="canvasLast" class="dest-last" hidden></p>
     </div>
     <button id="canvasFolder" class="ghost-button">选择目录</button>
    </div>
    <div class="canvas-actions">
     <label class="toggle-row small" title="整图单独设置，默认关闭"><input id="canvasSuperPNG" type="checkbox"><span class="toggle" aria-hidden="true"></span><span>SuperPNG 编码</span></label>
     <button id="canvasExport" class="canvas-export" disabled>导出整图</button>
    </div>
   </section>
  </aside>
 </div>

 <footer class="statusbar" id="statusbar" data-kind="idle" role="status" aria-live="polite">
  <span class="status-icon" aria-hidden="true"></span>
  <div class="status-text"><strong id="statusTitle">正在连接 Photoshop…</strong><span id="statusDetail"></span></div>
  <button id="statusOpen" class="ghost-button" hidden>打开目录</button>
  <button id="statusLog" class="ghost-button" hidden>查看日志</button>
  <button id="cancelJob" class="ghost-button danger" hidden>取消</button>
  <div class="progress" aria-hidden="true"><i></i></div>
 </footer>

 <section id="logPanel" class="log-panel" hidden aria-label="运行日志">
  <header class="log-header">
   <h2>运行日志</h2>
   <label class="log-verbose"><input id="logVerbose" type="checkbox">显示详细</label>
   <button id="logCopy" class="primary-button" title="复制环境、日志与 Generator 日志，可直接粘贴发送">复制诊断信息</button>
   <button id="logFolder" class="ghost-button" title="打开日志文件所在目录">打开日志目录</button>
   <button id="logClose" class="icon-button" aria-label="关闭日志">×</button>
  </header>
  <div id="logList" class="log-list" role="log"></div>
  <footer class="log-footer"><span id="logNote"></span><span id="version">v2.0.0</span><button id="restoreSize" class="link-button" title="把面板恢复为 760 × 620">恢复默认大小</button></footer>
  <textarea id="debug" class="debug" hidden readonly aria-label="诊断信息，可按 Ctrl+C 复制"></textarea>
 </section>
</div>
<script src="js/panel.js"></script>
</body>
</html>
