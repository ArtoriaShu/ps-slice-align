/* v1.10 — Nocturne glass. One shared shell, no separate export card.
   The static light wells are the Photoshop 2019 fallback. Backdrop filtering
   enhances only small overlay surfaces when the host supports it. */
:root{--ink:#f0f2f7;--muted:#b0bbcf;--link:#c3cee0;--line:rgba(209,223,248,.15);--white:rgba(255,255,255,.07);--base:#111827;--gold:#ecd092}
body{color:var(--ink);background:#0e1523;color-scheme:dark}

.brand-mark i{background:#f0f2f7}.brand-mark i:last-child{background:#bac9df}

.preset{border-radius:12px}.preset:first-child,.preset.active{background:rgba(222,232,252,.10);box-shadow:inset 0 1px 0 rgba(229,238,255,.09)}

.canvas-destination-heading h2{color:var(--muted)}.canvas-destination strong{color:#edf1f8}.canvas-destination p{color:var(--muted)}
